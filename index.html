<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Galería Imágenes con Pexels</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:opsz@14..32&family=Old+Standard+TT:wght@400;700&display=swap"
    rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <div id="modalFavoritos" class="modalFavoritos">
    <div class="containerFavoritos pad25px center">
      <button id="btnCerrar" class="cerrar">&times;</button>
      <h2>Listado Favoritos</h2>
      <div id="galeriaFavoritos" class="flexContainer"></div>
    </div>
  </div>
  <header class="center p10px"><p class="fztitle fontSecundaria lh-titles fw400">Galería Imágenes con Pexels</p></header>
  <main class="container pb50px">
    <section class="flexContainer borderTop1px borderBottom1px p10px mb20px">
      <section id="pintarBusqueda"></section>
      <section><button id="botonInicio">Inicio</button></section>
      <section><button id="botonFavoritos">Favoritos</button></section>
    </section>
    <section id="sectionCategorias" class="mb20px"></section>
    <section id="sectionFiltrado" class="flexContainer mb20px g5px"></section>
    <section id="sectionGaleria" class="gridContainer"></section>
    <section id="sectionPaginado" class="flexContainer g5px borderTop1px mt20px p10px"></section>
  </main>
  <footer class="center fondoPrincipal pad20px0"><p>©Ejercicios Bootcamp 2026</p></footer>


  <script src="js/main.js"></script>
</body>
</html>
